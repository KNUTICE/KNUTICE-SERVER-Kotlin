server:
  port: ${CRAWLER_PORT}

spring:
  config:
    import:
      - "classpath:common.yaml"        # common : Slack 웹훅, 로깅, Actuator
      - "classpath:postgresql.yaml"    # persistence-common : PostgreSQL · JPA
      - "classpath:reading-room.yaml"  # reading-room : 열람실 원격 API

  application:
    name: KNUTICE-CRAWLER

  # 요청 처리 · @Async · @Scheduled 를 가상 스레드에서 실행한다
  threads:
    virtual:
      enabled: true

  # 배치 실행기 빈이 있어도 @Async(Slack 웹훅)용 applicationTaskExecutor 를 만든다
  task:
    execution:
      mode: force

  # RestClient 기본 타임아웃 (학교 게시판 · 식단 사이트)
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

  # api 와 같은 DB 를 쓰므로 스키마 마이그레이션(BATCH_* 포함)은 api 에서만 실행한다
  flyway:
    enabled: false

  batch:
    job:
      # 기동할 때 Job 을 실행하지 않는다. Job 은 스케줄 폴러가 실행한다
      enabled: false
    jdbc:
      initialize-schema: never

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}  # https://aistudio.google.com/apikey
      chat:
        # Spring AI 2.0 은 OpenAI 공식 Java SDK 기반이라 completions-path 설정이 없다.
        # SDK 가 base-url 뒤에 /chat/completions 를 붙인다 → .../v1beta/openai/chat/completions
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        model: gemini-2.5-flash-lite
        temperature: 0
        # 재시도는 GeminiSummaryAdapter 가 요청 간격을 지키며 한다. SDK 재시도는 간격 없이 다시 보내므로 끈다
        max-retries: 0

firebase:
  secret:
    key:
      path: ${FIREBASE_KEY_PATH}

crawler:
  poller:
    enabled: true
    request-batch-size: 20
  launch:
    async: true
    max-concurrency: 10
  push:
    chunk-size: 500
    # 발송 chunk 트랜잭션이 커넥션을 쥐고 있으므로 Hikari 풀(기본 10)보다 작게 둔다
    partition-concurrency: 4
    max-attempts: 3
  crawl:
    max-concurrency: 8
    timeout: 3m
  summary:
    chunk-size: 5
    max-attempts: 3
    # 실패한 공지는 30분 뒤에 다시 시도한다 (짧은 장애 동안 시도 횟수를 다 쓰지 않도록)
    retry-interval: 30m
    # Gemini 분당 요청 한도(프로젝트 단위, AI Studio 에서 확인)보다 느리게 보낸다. 5초 = 분당 12회
    request-interval: 5s
    # 429 를 받으면 1분 동안 요청하지 않고 남은 공지는 다음 실행으로 미룬다
    rate-limit-cooldown: 1m
  embedding:
    chunk-size: 5
    max-attempts: 3
    retry-interval: 30m
    # 요약과 같은 키. CrawlerProperties 에 넣지 않고 GeminiEmbeddingAdapter 가 직접 읽는다
    api-key: ${GEMINI_API_KEY}
    model: gemini-embedding-2
    # 무료 한도(분당 100회 · 3만 토큰, 하루 1,000회)는 묶음 요청도 입력마다 센다.
    # 입력 하나당 2초 = 분당 30개, 본문 조각(약 700자)이 다 차도 분당 3만 토큰 안쪽
    request-interval: 2s
    rate-limit-cooldown: 1m
    # 하루 한도를 다 쓰면 1시간 멈춘다 (그동안 학교 사이트도 읽지 않음)
    daily-limit-cooldown: 1h
    # Gemini 인증 · 5xx, 학교 사이트 장애면 그 공지만 실패로 세고 10분 멈춘다
    error-cooldown: 10m
    max-batch-size: 20
    # 본문 이미지는 상세 페이지를 다시 읽어 얻는다. 학교 사이트(ut.ac.kr)만 요청하고, 1초 간격으로 보낸다
    max-images-per-notice: 10
    allowed-image-host: ut.ac.kr
    min-image-size: 2KB
    max-image-size: 5MB
    site-request-interval: 1s
    site-timeout: 15s
    # 학교 이미지 서버는 느리다(1.3MB 에 52~72초). 넘으면 그 이미지만 건너뛰고 본문 · 다른 이미지는 저장한다
    image-timeout: 90s
  seat-alert:
    max-concurrency: 4
    timeout: 30s
