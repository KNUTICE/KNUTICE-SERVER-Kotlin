server:
  port: ${API_PORT}

spring:
  config:
    import:
      - "classpath:common.yaml"        # common : Slack 웹훅, 로깅, Actuator
      - "classpath:mysql.yaml"         # persistence-common : MySQL · JPA
      - "classpath:mongodb.yaml"       # persistence-common : MongoDB 연결
      - "classpath:reading-room.yaml"  # reading-room : 열람실 원격 API

  application:
    name: KNUTICE-API
  messages:
    basename: messages
    encoding: UTF-8
    # 해당하는 Locale 이 없을 때 System Locale 을 사용하지 않도록 설정, 기본으로 설정된 message.properties (한국어) 사용
    fallback-to-system-locale: false

  data:
    mongodb:
      auto-index-creation: true

  # HTTP Interface Client (OpenFeign 대체). timeout 은 기존 OpenFeign 기본값(10s / 60s) 유지
  http:
    serviceclient:
      crawler:
        base-url: ${CRAWLER_SERVER_ADDRESS}
        connect-timeout: 10s
        read-timeout: 60s

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access-token:
    plus-hour: ${JWT_ACCESS_PLUS_HOUR}
  refresh-token:
    plus-hour: ${JWT_REFRESH_PLUS_HOUR}

file:
  upload-dir: ${FILE_UPLOAD_DIR}
  context-path: ${FILE_CONTEXT_PATH}

url:
  scheme: ${URL_SCHEME}
  host: ${URL_HOST}
  allowed-origins:
    - http://localhost:5173
    - ${URL_ORIGIN}
