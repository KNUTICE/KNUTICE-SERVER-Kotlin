spring:
  config:
    import:
      - "classpath:mysql.yaml"   # persistence-common : MySQL · JPA

  application:
    name: KNUTICE-MIGRATION

  # 웹 서버 없이 이관만 하고 끝낸다
  main:
    web-application-type: none

  # 레거시 MongoDB (읽기 전용으로만 쓴다)
  mongodb:
    uri: ${MONGO_URI}
    database: ${MONGO_DATABASE}

  # 대상 스키마(BATCH_* 포함)를 이관 전에 만든다. 이미 있으면 남은 버전만 적용한다
  flyway:
    enabled: true

migration:
  # 레거시 앱이 날짜를 저장할 때 쓴 시스템 타임존 (컨테이너 TZ)
  legacy-zone: Asia/Seoul
  chunk-size: 1000
